name: Deploy Security Analyzer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend-check:
    name: Test & Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Python syntax
        run: python -m compileall .

  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env:
      DEPLOY_DIR: /srv/apps/security-analyzer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to deployment directory
        run: |
          mkdir -p "$DEPLOY_DIR"

          if command -v rsync >/dev/null 2>&1; then
            rsync -av \
              --exclude='.git' \
              --exclude='.env*' \
              --exclude='*.db' \
              --exclude='*.sqlite*' \
              --exclude='reports' \
              --exclude='venv' \
              --exclude='backend/venv' \
              --exclude='node_modules' \
              --exclude='frontend/node_modules' \
              ./ "$DEPLOY_DIR/"
          else
            find . -maxdepth 1 \
              ! -name . \
              ! -name .git \
              ! -name '.env*' \
              ! -name '*.db' \
              ! -name '*.sqlite*' \
              ! -name reports \
              ! -name venv \
              ! -name node_modules \
              -exec cp -r -u -t "$DEPLOY_DIR/" {} +
          fi

      - name: Build frontend
        run: |
          cd "$DEPLOY_DIR/frontend"
          npm ci
          npm run build
          echo "Frontend build completed successfully."

      - name: Prepare backend Python environment
        run: |
          cd "$DEPLOY_DIR/backend"

          if [ -d "venv" ]; then
            echo "Using existing backend/venv"
            source venv/bin/activate

          elif [ -d "../venv" ]; then
            echo "Using existing root venv"
            source ../venv/bin/activate

          else
            echo "Creating new virtual environment at backend/venv"
            python3 -m venv venv
            source venv/bin/activate
          fi

          python3 -m pip install --upgrade pip

          if [ -s requirements.txt ]; then
            pip install -r requirements.txt
          fi

          echo "Backend dependencies prepared successfully."

      - name: Restart backend
        run: |
          sudo -n /usr/bin/systemctl restart security-analyzer-backend.service
          sudo -n /usr/bin/systemctl is-active --quiet security-analyzer-backend.service
          echo "Backend service restarted successfully."

      - name: Verify backend
        run: |
          curl --fail --silent http://127.0.0.1:5000/health
          echo
          echo "Backend health check passed."

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "       11N11 SECURITY ANALYZER            "
          echo "       HOME SERVER DEPLOYMENT              "
          echo "=========================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Deployment Directory: $DEPLOY_DIR"
          echo "Frontend Build: SUCCESS"
          echo "Backend Dependency Preparation: SUCCESS"
          echo "Backend Restart: SUCCESS"
          echo "Health Check: SUCCESS"
          echo "=========================================="
